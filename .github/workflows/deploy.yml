name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every night so new rows in the sheet show up without a push.
  schedule:
    - cron: "17 4 * * *"
  # "Run workflow" button in the Actions tab – use it right after editing the sheet.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch games from the sheet + BoardGameGeek
        run: npm run data
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          SHEET_ID: ${{ vars.SHEET_ID }}
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
