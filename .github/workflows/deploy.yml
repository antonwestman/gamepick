name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PRs build (incl. fetching real data) but don't deploy.
  pull_request:
  # Rebuild every night so new rows in the sheet show up without a push.
  schedule:
    - cron: "17 4 * * *"
  # "Run workflow" button in the Actions tab – use it right after editing the sheet.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch games from the sheet + BoardGameGeek
        run: npm run data
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          SHEET_ID: ${{ vars.SHEET_ID }}
      - run: npm run build
        env:
          # Project pages live at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Apps Script web app for votes (apps-script/Code.gs). Empty → voting hidden.
          VITE_VOTES_URL: ${{ vars.VOTES_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
